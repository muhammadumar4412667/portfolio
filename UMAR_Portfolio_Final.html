const portrait=()=>CONFIG.portrait?`<img src="${CONFIG.portrait}" alt="Illustrative blue-lit profile portrait; replace with your own photo" width="418" height="489" loading="eager" decoding="async">`:`<svg viewBox="0 0 400 520" role="img" aria-label="Placeholder silhouette portrait"><defs><linearGradient id="rim" x1="0" x2="1"><stop offset="0" stop-color="#1450C8" stop-opacity=".25"/><stop offset=".55" stop-color="#4a89ff"/><stop offset="1" stop-color="#a9ccff"/></linearGradient><radialGradient id="fl" cx=".75" cy=".4" r=".75"><stop offset="0" stop-color="#0a1a4a"/><stop offset="1" stop-color="#02040c"/></radialGradient></defs><path d="M40 520C60 470 110 450 140 430C150 400 140 370 135 340C95 320 80 250 110 190C140 120 230 100 285 135C300 150 305 175 312 195L336 232L318 240C322 252 326 258 318 266C322 272 320 278 312 282C316 292 306 302 296 310C290 330 270 345 255 352L250 400C270 430 330 450 380 470L400 520Z" fill="url(#fl)" stroke="url(#rim)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;

const home=()=>`<section class="hero" aria-labelledby="hero-heading">
<div class="hero-orb" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div>
<div class="hero-line" aria-hidden="true"></div>
<div class="hero-inner">
<h1 id="hero-heading" class="name"><span class="ln"><b>UMAR</b></span></h1>
<div class="pt">${portrait()}</div>
<div class="hl"><span class="eyebrow"><span class="dash"></span> INDEPENDENT CREATIVE PORTFOLIO</span><h2>Professional Website<br>Designer <em>&amp;</em><br>Creative Freelancer.</h2><p>I create modern websites and digital experiences that help businesses grow and stand out.</p><div class="row"><a class="btn" href="#portfolio">View My Work ${I("arrow")}</a><a class="btn ghost" href="#contact">Let's Talk ${I("arrow")}</a></div><p class="av"><span class="dot"></span>Available for freelance projects</p></div>
<div class="rt"><span class="eyebrow">MY EXPERTISE</span><ol class="hr" aria-label="Expertise"><li><span>(01)</span>Website Design</li><li><span>(02)</span>Web Development</li><li><span>(03)</span>E-commerce Websites</li><li><span>(04)</span>Video Editing</li></ol></div>
<div class="panel"><div><span class="feature-ic">${I("laptop")}</span><span><strong>Website Design</strong><small>Modern &amp; responsive</small></span></div><div><span class="feature-ic">${I("layers")}</span><span><strong>Creative Development</strong><small>Clean &amp; scalable</small></span></div><div><span class="feature-ic">${I("play")}</span><span><strong>Video Editing</strong><small>Engaging &amp; polished</small></span></div></div>
<button type="button" class="scroll-cue" id="scroll-to-work" aria-label="Scroll to featured projects"><span></span></button>
</div></section>
<section class="wrap sec" id="featured"><div class="section-top rv"><span class="eyebrow">SELECTED WORK</span><a href="#portfolio" class="text-link">Explore all projects ${I("arrow")}</a></div><h2 class="t rv">A glimpse of what I can create<span class="blue-dot">.</span></h2><p class="lead rv" style="margin:-8px 0 26px">These are sample layouts until my real client projects are added.</p><div class="grid">${P.slice(0,3).map(card).join("")}</div></section>
<section class="wrap sec"><span class="eyebrow rv">THE DIFFERENCE</span><h2 class="t rv">Thoughtful design. Real attention to detail<span class="blue-dot">.</span></h2><div class="grid">${WHY.map(([t,d])=>`<div class="card rv"><h3>${t}</h3><p>${d}</p></div>`).join("")}</div></section>
<section class="wrap sec"><div class="card cta rv"><span class="eyebrow">HAVE A PROJECT IN MIND?</span><h2>Let’s build something <span class="big">exceptional.</span></h2><a class="btn" href="#contact">Let’s work together ${I("arrow")}</a></div></section>`;

const about=()=>`<section class="wrap pg"><h1 class="big">About me</h1>
<p class="lead rv">I’m Muhammad Umar, a 19-year-old college student and professional website designer. I’m passionate about modern digital experiences, curious about new technologies, and focused on helping businesses build a professional presence online.</p>
<div class="two"><div><h2 class="t">My story</h2><p class="lead rv" style="margin-top:0">I’m studying while building a freelance career in website design and video editing. Each project is a chance to learn something new and raise my standard, and I want my work to earn the trust of clients anywhere in the world.</p><h2 class="t">What I do</h2><p class="lead rv" style="margin-top:0">I design and develop websites for businesses, startups, entrepreneurs and creators, and I edit video content for social platforms.</p></div>
<div class="card rv"><h3 style="margin-top:0">My skills</h3><div class="tags">${chips(CONFIG.skills)}</div>${CONFIG.resume?`<p style="margin-top:18px"><a class="btn ghost" href="${CONFIG.resume}" target="_blank" rel="noopener">View resume</a></p>`:""}</div></div>
<h2 class="t">My creative approach</h2><div class="grid">${[["Start with people","Every layout begins with who will use it and what they need to do."],["Keep it clear","Strong hierarchy, readable type and generous spacing."],["Polish the details","Small touches in motion and alignment make a site feel premium."]].map(([t,d])=>`<div class="card rv"><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
<h2 class="t">My learning journey</h2><div class="tl">${[["Learning web design and development","Studying layout, typography and how websites are built."],["Adding video editing","Bringing the same eye for pacing and detail to video."],["Exploring new technologies","Trying new tools and techniques to keep my work current."],["Building toward client projects","Turning what I learn into work that helps real businesses."]].map(([t,d])=>`<div class="rv"><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
<h2 class="t">My goals</h2>${lis(["Grow as a designer and developer","Deliver work that international clients can trust","Keep learning and sharpening my craft"])}
<h2 class="t">My work process</h2><div class="grid">${STEPS.map(([t,d],i)=>`<div class="card rv"><span class="chip">(0${i+1})</span><h3>${t}</h3><p>${d}</p></div>`).join("")}</div></section>`;

const services=()=>`<section class="wrap pg"><h1 class="big">Services</h1><p class="lead">Website design and video editing, with room to add more services as I grow.</p><div class="grid" style="margin-top:34px">${CONFIG.services.map(s=>`<article class="card rv"><div class="ico">${I(s.icon)}</div><h3>${s.title}</h3><p>${s.desc}</p><h4 style="margin-top:18px;font-size:.9rem">Key deliverables</h4>${lis(s.items)}<p style="margin-top:22px"><a class="btn" href="#contact" data-type="${s.type}">Start an inquiry</a></p></article>`).join("")}</div></section>`;

const portfolio=()=>`<section class="wrap pg"><h1 class="big">Portfolio</h1><p class="lead">Sample projects below are placeholders. Add your real work in CONFIG.projects.</p><div class="fb" id="fb" role="group" aria-label="Filter projects">${["All Projects",...CONFIG.categories].map(c=>`<button type="button" data-f="${c}" aria-pressed="false">${c}</button>`).join("")}</div><div class="grid" id="pg"></div></section>`;

const detail=p=>`<section class="wrap pg"><a class="btn ghost" href="#portfolio">Back to portfolio</a><h1 class="big" style="margin-top:28px;font-size:clamp(2.2rem,7vw,5rem)">${p.title}</h1><div class="tags"><span class="chip">${p.cat}</span><span class="chip">Placeholder project</span></div><div class="thumb" style="--h:${p.hue};margin-top:30px;aspect-ratio:16/8"><b class="badge">Placeholder preview</b></div>
<div class="two"><div><h2 class="t">Overview</h2><p class="lead" style="margin-top:0">${p.overview}</p><h2 class="t">Design objectives</h2>${lis(p.goals)}<h2 class="t">My responsibilities</h2>${lis(p.role)}</div><aside class="card" style="margin-top:64px"><h3 style="margin-top:0">Tools and technologies</h3><div class="tags" style="margin-top:0">${chips(p.tech)}</div><h3>Links</h3>${p.live?`<a class="btn" href="${p.live}" target="_blank" rel="noopener">Live website</a>`:'<p class="sm">No external links yet.</p>'}</aside></div>
<h2 class="t">Screenshots</h2><div class="grid">${[1,2,3].map(n=>`<div class="thumb" style="--h:${p.hue+n*9}"><b class="badge">Screenshot ${n} (placeholder)</b></div>`).join("")}</div><h2 class="t">Final result</h2><p class="lead" style="margin-top:0">${p.result}</p></section>`;

const lk=()=>[["Email",CONFIG.email?"mailto:"+CONFIG.email:"",PH?CONFIG.email+" (placeholder)":CONFIG.email],...Object.entries(CONFIG.links).map(([k,v])=>[k,v,v?"Open":"Add your link in CONFIG.links"])].map(([k,h,t])=>h?`<a class="lk" href="${h}" ${h.startsWith("http")?'target="_blank" rel="noopener"':""}><span>${k}</span><small>${t}</small></a>`:`<div class="lk off"><span>${k}</span><small>${t}</small></div>`).join("");
const contact=()=>`<section class="wrap pg"><h1 class="big">Let’s work together</h1><p class="lead">Tell me about your project and I’ll reply by email.</p>
<div class="two" style="margin-top:34px"><form id="cf" class="card" novalidate>
<label>Full name<input name="fn" autocomplete="name" aria-describedby="e-fn"><span class="err" id="e-fn"></span></label>
<label>Email address<input name="em" type="email" autocomplete="email" aria-describedby="e-em"><span class="err" id="e-em"></span></label>
<label>Project type<select name="ty" aria-describedby="e-ty"><option value="">Choose one</option>${["Website design / development","E-commerce website","Landing page","Video editing","Other"].map(o=>`<option>${o}</option>`).join("")}</select><span class="err" id="e-ty"></span></label>
<label>Estimated budget (optional)<select name="bu"><option value="">Not sure yet</option><option>Under $500</option><option>$500 to $1,000</option><option>$1,000 to $3,000</option><option>$3,000+</option></select></label>
<label>Project description<textarea name="ds" rows="5" aria-describedby="e-ds"></textarea><span class="err" id="e-ds"></span></label>
<div class="hp" aria-hidden="true"><label>Leave this field empty<input name="hp" tabindex="-1" autocomplete="off"></label></div>
<button class="btn" type="submit" style="justify-self:start">Submit inquiry</button><div class="msg" id="fm" role="status" aria-live="polite"></div>
${PH?'<p class="sm">Preview note: this form opens an email to a placeholder address. Set CONFIG.email before publishing.</p>':""}</form>
<div class="links">${lk()}</div></div>
<div class="card cta rv" style="margin-top:56px"><h2>Let’s turn your idea into reality.</h2><a class="btn" href="mailto:${CONFIG.email}">Email me</a></div></section>`;
const nf=()=>`<section class="wrap pg" style="min-height:70svh"><h1 class="big">404</h1><p class="lead">This page doesn’t exist or has moved. Head back home or browse the portfolio.</p><div class="row"><a class="btn" href="#home">Go home</a><a class="btn ghost" href="#portfolio">View portfolio</a></div></section>`;
const V={home,about,services,portfolio,contact};

const foot=()=>`<footer class="ft"><div class="wrap fg"><div><a class="logo" href="#home">UMAR<span class="logo-mark">.</span></a><p>Designing Digital Experiences That Matter.</p><p>Website design, web development and video editing for businesses, startups and creators.</p></div>
<div><h4>Quick links</h4><a href="#home">Home</a><a href="#about">About</a><a href="#services">Services</a><a href="#portfolio">Portfolio</a><a href="#contact">Contact</a></div>
<div><h4>Services</h4>${CONFIG.services.map(s=>`<a href="#services">${s.title}</a>`).join("")}</div>
<div><h4>Contact</h4><a href="mailto:${CONFIG.email}">${CONFIG.email}</a>${Object.entries(CONFIG.links).filter(([,v])=>v).map(([k,v])=>`<a href="${v}" target="_blank" rel="noopener">${k}</a>`).join("")}</div></div>
<p class="wrap cp">© ${new Date().getFullYear()} Muhammad Umar. All rights reserved.</p></footer>`;
$("#ft").innerHTML=foot();

function initHome(){if(!G||RM)return;
 gsap.timeline({defaults:{ease:"power3.out"}}).from(".name b",{yPercent:110,duration:1,stagger:.12}).from(".pt",{opacity:0,scale:.96,duration:1.1},"-=.7").from(".hl>*,.rt>*,.panel",{opacity:0,y:22,duration:.7,stagger:.07},"-=.6");
 if(innerWidth>820)gsap.to(".pt",{yPercent:4,ease:"none",scrollTrigger:{trigger:".hero",start:"top top",end:"bottom top",scrub:true}});
 fl=gsap.to(".panel",{y:-4,duration:4,yoyo:true,repeat:-1,ease:"sine.inOut",delay:2})}
function reveal(){if(!G||RM)return;gsap.set(".rv",{opacity:0,y:26});
 ScrollTrigger.batch(".rv",{start:"top 90%",once:true,onEnter:b=>gsap.to(b,{opacity:1,y:0,duration:.6,stagger:.08,ease:"power2.out",clearProps:"all"})})}
function initPortfolio(){const grid=$("#pg"),bar=$("#fb");
 const show=f=>{const l=f==="All Projects"?P:P.filter(p=>p.cat===f);
  grid.innerHTML=l.length?l.map(card).join(""):`<div class="card"><h3>No projects in this category yet</h3><p>Add one to CONFIG.projects with the category “${f}”.</p></div>`;
  $$("button",bar).forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===f));
  if(G&&!RM)gsap.from(".pc",{opacity:0,y:18,duration:.45,stagger:.06,ease:"power2.out",clearProps:"all"})};
 bar.onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.f)};show("All Projects")}
function initContact(){const f=$("#cf"),m=$("#fm"),g=n=>f.elements[n];if(pref)g("ty").value=pref;
 const R={fn:v=>v.trim().length>=2||"Enter your full name.",em:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)||"Enter a valid email address, like name@example.com.",ty:v=>!!v||"Choose a project type.",ds:v=>v.trim().length>=20||"Describe your project in at least 20 characters."};
 f.addEventListener("submit",e=>{e.preventDefault();if(g("hp").value)return;let ok=true;
  for(const k in R){const r=R[k](g(k).value),bad=r!==true;g(k).setAttribute("aria-invalid",bad);$("#e-"+k).textContent=bad?r:"";if(bad&&ok){g(k).focus();ok=false}}
  if(!ok){m.className="msg bad";m.textContent="Please fix the highlighted fields and try again.";return}
  const body=`Name: ${g("fn").value}\nEmail: ${g("em").value}\nProject type: ${g("ty").value}\nBudget: ${g("bu").value||"Not specified"}\n\n${g("ds").value}`;
  m.className="msg ok";m.textContent="Your email app should open with this inquiry ready to send. Nothing is sent until you press Send there.";
  location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent("Project inquiry from "+g("fn").value)}&body=${encodeURIComponent(body)}`})}

function route(){const h=location.hash.slice(1)||"home",pj=h.startsWith("project-")?P.find(x=>"project-"+x.slug===h):null,key=pj?"portfolio":V[h]?h:"404";
 if(G)ScrollTrigger.getAll().forEach(t=>t.kill());if(fl)fl.kill();
 app.innerHTML=pj?detail(pj):(V[h]||nf)();scrollTo({top:0,behavior:"instant"});
 const[t,d]=pj?[pj.title+" | Muhammad Umar",pj.desc]:META[key];document.title=t;$("meta[name=description]").content=d;
 $$("#menu a").forEach(a=>a.getAttribute("href")==="#"+key?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
 $("#nav").classList.remove("open");$("#bg").setAttribute("aria-expanded","false");
 if(G&&!RM&&!first)gsap.fromTo(app,{opacity:0,y:14},{opacity:1,y:0,duration:.45,ease:"power2.out",clearProps:"all"});
 if(key==="home"){initHome();const sc=$("#scroll-to-work");if(sc)sc.onclick=()=>$("#featured").scrollIntoView({behavior:RM?"instant":"smooth"});}if(key==="portfolio"&&!pj)initPortfolio();if(key==="contact")initContact();reveal();
 if(!first)app.focus({preventScroll:true});first=false;if(G)ScrollTrigger.refresh()}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{const a=e.target.closest("[data-type]");if(a)pref=a.dataset.type});
$("#bg").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o);$("#bg").setAttribute("aria-label",o?"Close menu":"Open menu")};
addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#nav").classList.contains("open")){$("#nav").classList.remove("open");$("#bg").setAttribute("aria-expanded","false");$("#bg").focus()}});
$("#sk").onclick=e=>{e.preventDefault();app.focus()};
route();
</script>
</body>
</html>
